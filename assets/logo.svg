<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="playBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D0B2E" />
      <stop offset="100%" stop-color="#080209" />
    </radialGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF548F" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <filter id="playGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#playBg)" stroke="#FF548F" stroke-width="4" stroke-opacity="0.6" />

  <!-- Play Triangle Icon -->
  <polygon points="190,140 370,256 190,372" fill="url(#playGrad)" filter="url(#playGlow)" />
  <polygon points="210,180 330,256 210,332" fill="#FFFFFF" opacity="0.85" />
</svg>
